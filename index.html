<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odeiya - Spin & Win!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #121214; color: white; text-align: center; margin: 0; overflow-x: hidden; }
        .screen { display: none; padding: 20px; min-height: 100vh; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; }
        .active { display: flex; }
        
        /* AD SCREEN */
        .ad-container { 
            width: 100%; 
            max-width: 350px; 
            background: #1c1c1e; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #333; 
            margin-bottom: 20px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .ad-media {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #000;
        }
        .ad-info {
            padding: 12px 16px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252528;
        }
        .ad-title { font-size: 14px; font-weight: bold; color: #fff; margin: 0; }
        .ad-desc { font-size: 12px; color: #aaa; margin: 3px 0 0 0; }
        .ad-cta-btn {
            background: #007AFF;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }
        .ad-timer-bar {
            width: 100%;
            height: 4px;
            background: #333;
        }
        .ad-timer-fill {
            height: 100%;
            width: 0%;
            background: #FF3B30;
            transition: width 1s linear;
        }
        
        .btn { padding: 15px 30px; font-size: 18px; background: #555; color: white; border: none; border-radius: 8px; transition: 0.3s; width: 85%; max-width: 320px; font-weight: bold; text-decoration: none; box-sizing: border-box; }
        #skip-btn { opacity: 0.5; pointer-events: none; }
        #skip-btn.ready { background: #FF3B30; opacity: 1; pointer-events: auto; cursor: pointer; }

        /* CARNIVAL WHEEL SCREEN */
        .wheel-wrapper {
            position: relative;
            width: min(94vw, 390px);
            height: min(94vw, 390px);
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #wheel-canvas { 
            width: min(90vw, 370px); 
            height: min(90vw, 370px); 
            border-radius: 50%; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75), 0 0 0 6px #2a2a2e;
            transition: transform 4.5s cubic-bezier(0.12, 0.8, 0.15, 1);
        }
        /* Right-Side Pointer */
        .pointer-right { 
            position: absolute; 
            right: -4px; 
            top: 50%; 
            transform: translateY(-50%); 
            width: 0; 
            height: 0; 
            border-top: 16px solid transparent; 
            border-bottom: 16px solid transparent; 
            border-right: 32px solid #FF3B30; 
            z-index: 20; 
            filter: drop-shadow(-3px 0 5px rgba(0,0,0,0.6));
        }
        .pointer-right::after {
            content: '';
            position: absolute;
            top: -8px;
            right: -28px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 16px solid #ffffff;
        }
        #spin-btn { background: #FFCC00; color: #111; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3); }
        #spin-btn:disabled { background: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        /* FORM SCREEN */
        input { padding: 15px; font-size: 18px; width: 88%; max-width: 320px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; text-align: center; outline: none; }
        #submit-btn { background: #007AFF; cursor: pointer; }
        
        /* DM & LOCKED SCREENS */
        .dm-btn { background: #E1306C; display: inline-flex; align-items: center; justify-content: center; }
        .lock-card { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; padding: 30px 20px; max-width: 320px; width: 90%; }
    </style>
</head>
<body>

    <!-- SCREEN 1: ADVERTISEMENT -->
    <div id="screen-ad" class="screen">
        <h2 style="margin-bottom: 6px;">스폰서 광고</h2>
        <p style="color: #888; font-size: 13px; margin: 0 0 16px 0;">광고 시청 후 룰렛 이용이 가능합니다</p>

        <div class="ad-container">
            <div class="ad-timer-bar">
                <div id="ad-progress" class="ad-timer-fill"></div>
            </div>
            
            <!-- Bulletproof Media Banner (Supports GIF, WebP, or PNG) -->
            <a href="https://www.instagram.com/r000h___/" target="_blank" style="display: block; text-decoration: none;">
                <img 
                    id="ad-banner-img"
                    class="ad-media" 
                    src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80" 
                    alt="Sponsor Ad"
                    style="object-fit: cover;"
                />
            </a>

            <div class="ad-info">
                <div>
                    <p class="ad-title">스폰서 공식 채널</p>
                    <p class="ad-desc">지금 방문하고 추가 혜택 받기</p>
                </div>
                <a href="https://www.instagram.com/r000h___/" target="_blank" class="ad-cta-btn">바로가기</a>
            </div>
        </div>

        <button id="skip-btn" class="btn">5초 후 건너뛰기</button>
    </div>

    <!-- SCREEN 2: THE WHEEL -->
    <div id="screen-wheel" class="screen">
        <h2 style="margin-bottom: 2px;">행운의 룰렛</h2>
        <p style="color: #aaa; margin-top: 0; font-size: 14px;">최대 100,000원의 상금을 잡으세요!</p>
        
        <div class="wheel-wrapper">
            <div class="pointer-right"></div>
            <canvas id="wheel-canvas" width="800" height="800"></canvas>
        </div>

        <button id="spin-btn" class="btn">룰렛 돌리기</button>
    </div>

    <!-- SCREEN 3: CLAIM FORM -->
    <div id="screen-form" class="screen">
        <h1 id="prize-text" style="color: #FFCC00; font-size: 32px; margin-bottom: 10px;">당첨!</h1>
        <p style="color: #ccc; margin-bottom: 25px;">상금 수령 안내를 위해 인스타그램 아이디를 입력해주세요.</p>
        <input type="text" id="ig-username" placeholder="@your_instagram" required>
        <button id="submit-btn" class="btn">상금 수령 등록</button>
    </div>

    <!-- SCREEN 4: DM PROMPT -->
    <div id="screen-dm" class="screen">
        <h1 style="color: #34C759; margin-bottom: 10px;">등록 완료! 🔒</h1>
        <p style="color: #ccc; line-height: 1.5; margin-bottom: 25px;">
            정보가 정상적으로 저장되었습니다.<br>
            아래 버튼을 눌러 인스타그램 DM을 보내주셔야 검증 후 상금이 지급됩니다.
        </p>
        <a href="https://www.instagram.com/r000h___/" class="btn dm-btn" target="_blank">인스타그램 DM 보내기</a>
    </div>

    <!-- SCREEN 5: ACCESS BLOCKED (ALREADY USED) -->
    <div id="screen-used" class="screen">
        <div class="lock-card">
            <h1 style="color: #FF3B30; margin-bottom: 10px;">참여 완료 🚫</h1>
            <p style="color: #aaa; line-height: 1.5; margin-bottom: 25px;">
                이미 이 QR 코드로 참여를 완료하셨습니다.<br>해당 링크는 1인 1회만 이용 가능합니다.
            </p>
            <a href="https://www.instagram.com/r000h___/" class="btn dm-btn" target="_blank">상금 문의 (DM)</a>
        </div>
    </div>

    <script>
        let wonPrize = "";

        const urlParams = new URLSearchParams(window.location.search);
        const qrSource = urlParams.get('qr') || "default";
        const spinKey = "hasSpun_odeiya_" + qrSource;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        if (localStorage.getItem(spinKey) === "true") {
            showScreen("screen-used");
        } else {
            showScreen("screen-ad");
            startAdTimer();
        }

        // AD TIMER & PROGRESS BAR
        function startAdTimer() {
            let totalSeconds = 5;
            let secondsRemaining = totalSeconds;
            const skipBtn = document.getElementById("skip-btn");
            const progressBar = document.getElementById("ad-progress");
            
            const timer = setInterval(() => {
                secondsRemaining--;
                const elapsedPercent = ((totalSeconds - secondsRemaining) / totalSeconds) * 100;
                progressBar.style.width = elapsedPercent + "%";

                if (secondsRemaining > 0) {
                    skipBtn.innerText = `${secondsRemaining}초 후 건너뛰기`;
                } else {
                    clearInterval(timer);
                    skipBtn.innerText = "광고 건너뛰기 & 룰렛 돌리기";
                    skipBtn.classList.add("ready");
                    skipBtn.onclick = () => showScreen("screen-wheel");
                }
            }, 1000);
        }

        // CARNIVAL WHEEL RENDER
        const canvas = document.getElementById("wheel-canvas");
        const ctx = canvas.getContext("2d");

        const slices = [
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#1E88E5", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#43A047", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "10", sub: "만원", prize: "10,000 KRW", color: "#E91E63", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#1E88E5", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#43A047", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "100", sub: "만원", prize: "100,000 KRW", color: "#E53935", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#1E88E5", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#43A047", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "10", sub: "만원", prize: "10,000 KRW", color: "#E91E63", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#1E88E5", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "5", sub: "천원", prize: "5,000 KRW",  color: "#43A047", text: "#FFF" },
            { label: "1", sub: "천원", prize: "1,000 KRW",  color: "#FFD200", text: "#111" },
            { label: "10", sub: "만원", prize: "10,000 KRW", color: "#E91E63", text: "#FFF" }
        ];

        function drawCarnivalWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 14;
            const numSlices = slices.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            const hubRadius = radius * 0.44;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Rim
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 10, 0, 2 * Math.PI);
            ctx.fillStyle = "#222226";
            ctx.fill();

            // Slices
            slices.forEach((slice, i) => {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = slice.color;
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#2e2e33";
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + (sliceAngle / 2));
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = slice.text;

                ctx.font = "bold 38px 'Arial Black', Impact, sans-serif";
                ctx.fillText(slice.label, radius * 0.72, 0);

                ctx.font = "bold 15px Arial, sans-serif";
                ctx.fillText(slice.sub, radius * 0.88, 0);

                ctx.restore();
            });

            // Outer Pegs
            for (let i = 0; i < numSlices; i++) {
                const pinAngle = i * sliceAngle;
                const pinX = centerX + (radius + 2) * Math.cos(pinAngle);
                const pinY = centerY + (radius + 2) * Math.sin(pinAngle);

                ctx.beginPath();
                ctx.arc(pinX, pinY, 5, 0, 2 * Math.PI);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "#111111";
                ctx.stroke();
            }

            // Central White Hub
            ctx.beginPath();
            ctx.arc(centerX, centerY, hubRadius, 0, 2 * Math.PI);
            ctx.fillStyle = "#F5F5F7";
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#222226";
            ctx.stroke();

            // Hub Text
            ctx.fillStyle = "#222226";
            ctx.font = "bold 26px 'Arial Black', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("ODEIYA", centerX, centerY - 32);

            // Hub Center Cap
            ctx.beginPath();
            ctx.arc(centerX, centerY, 26, 0, 2 * Math.PI);
            ctx.fillStyle = "#E53935";
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "#8E0000";
            ctx.fill();
        }

        drawCarnivalWheel();

        // PROBABILITY SPIN LOGIC
        function spinWheel() {
            if (localStorage.getItem(spinKey) === "true") {
                showScreen("screen-used");
                return;
            }

            document.getElementById("spin-btn").disabled = true;

            const rand = Math.random() * 100;
            let targetPrize = "";

            if (rand < 44) {
                targetPrize = "1,000 KRW";
            } else if (rand < 84) {
                targetPrize = "5,000 KRW";
            } else if (rand < 99) {
                targetPrize = "10,000 KRW";
            } else {
                targetPrize = "100,000 KRW";
            }

            wonPrize = targetPrize;

            const matchingIndices = [];
            slices.forEach((slice, idx) => {
                if (slice.prize === targetPrize) matchingIndices.push(idx);
            });

            const targetSliceIndex = matchingIndices[Math.floor(Math.random() * matchingIndices.length)];
            const sliceDeg = 360 / slices.length;
            const sliceCenterDeg = (targetSliceIndex + 0.5) * sliceDeg;
            const stopDeg = (360 - sliceCenterDeg) % 360;
            const jitter = (Math.random() - 0.5) * (sliceDeg * 0.7);

            const totalRotation = (360 * 6) + stopDeg + jitter;
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            localStorage.setItem(spinKey, "true");

            setTimeout(() => {
                document.getElementById("prize-text").innerText = `${wonPrize} 당첨!`;
                showScreen("screen-form");
            }, 4700);
        }

        document.getElementById("spin-btn").addEventListener("click", spinWheel);

        // DATA WRITE TO GOOGLE APPS SCRIPT
        document.getElementById("submit-btn").addEventListener("click", () => {
            const igHandle = document.getElementById("ig-username").value;
            if (igHandle.trim() === "") {
                alert("인스타그램 아이디를 입력해주세요.");
                return;
            }

            const submitBtn = document.getElementById("submit-btn");
            submitBtn.innerText = "저장 중...";
            submitBtn.disabled = true;

            const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbxZtE2Ap0KnwBxtRPyMAzUtJeu3-SDZZIBuVBobL4eDSvNtJ8UOrv_5zQ1kl3Ovcsr5cQ/exec";

            const params = new URLSearchParams({
                qrSource: qrSource,
                igUsername: igHandle,
                prize: wonPrize
            });
            
            const finalUrl = GOOGLE_APP_URL + "?" + params.toString();

            fetch(finalUrl, { 
                method: 'GET', 
                mode: 'no-cors' 
            }).then(() => {
                showScreen("screen-dm");
            }).catch(() => {
                showScreen("screen-dm"); 
            });
        });
    </script>
</body>
</html>
